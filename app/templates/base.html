{% extends "bootstrap/base.html" %}

{% block title %}
    CC medapp
{% endblock %}

{% block styles %}
{{ super() }}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
<script>
function load_page() {
    var div_loader = document.getElementById("loader");
    div_loader.style.display = "block";

    var div_form_analyse = document.getElementById("form_analyse");
    div_form_analyse.style.display = "none";
}
</script>
{{ super() }}
{% endblock %}

{% block content %}
<div class="container-fluid">

    {% block app_content %}{% endblock %}

    <div class="ibm_logo">
        <img name="img_selected" src="{{ url_for('static', filename='img/ibm_logo.png') }}" height="35px">
    </div>
</div>
{% endblock %}
