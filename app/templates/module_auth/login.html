{% extends "base.html" %}

{% block app_content %}

    <div class="row header">
        <div class="col-sm-10 align-self-start">
            <form action="{{ url_for('module_auth.registration') }}" method="post">
                <input name="btn_registration" type="submit" class="btn btn-default"
                       value={{langfields.REGISTRATION}}>
            </form>
        </div>
    </div>

    <div class="lang_buttons">
            <form action="{{ url_for('module_auth.login') }}" method="post">
                    {% if lang == "ru" %}
                    <input name="btn_ru" type="submit" class="btn btn-default active" value={{langfields.RU}}>
                    <input name="btn_en" type="submit" class="btn btn-default" value={{langfields.EN}}>
                    {% else %}
                    <input name="btn_ru" type="submit" class="btn btn-default" value={{langfields.RU}}>
                    <input name="btn_en" type="submit" class="btn btn-default active" value={{langfields.EN}}>
                    {% endif %}
            </form>
    </div>

    <div class="row my-3">
        <div class="col-sm-3">
            <h1>{{langfields.SIGN_IN}}</h1>
        </div>
    </div>

    <form action="{{ url_for('module_auth.login') }}" method="post">
        <div class="row my-3">
            <div class="col-3">
                <label> {{langfields.USERNAME}} </label>
                <input name="input_username" type="text" class="form-control" placeholder="Username" required>
            </div>
        </div>

        <div class="row my-3">
            <div class="col-3">
                <label> {{langfields.PASSWORD}} </label>
                <input name="input_password" type="password" class="form-control" placeholder="Password" required>
            </div>
        </div>

        <div class="row my-3">
            <div class="col-3">
                <div class="form-check">
                    <input name="checkbox_remember" type="checkbox" class="form-check-input">
                    <label class="form-check-label"> {{langfields.REMEMBER_ME}} </label>
                </div>
            </div>
        </div>

        <div class="row my-3">
            <div class="col-3">
                <input name="btn_enter" type="submit" class="btn btn-primary" value={{langfields.ENTER}}>
            </div>
        </div>
    </form>

{% endblock %}
