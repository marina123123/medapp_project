{% extends "module_newsurvey/newsurvey_footer.html" %}

{% block app_content_next_next %}

    {% for text_block in text_fields %}
        <div class="form-row row">
            <h4 class="form-group col-3">{{text_block.id}}</h4>
        </div>
        <div class="form-row row">
            {% for field_name, field_elems in text_block.items() if not field_name=='id'%}
                <div class="form-group col-3">
                    <label class="font-weight-bold text-capitalize">{{field_name}}</label>
                    <select name="{{field_name}}" class="form-control">
                        {% for elem in field_elems %}
                        <option>{{elem}}</option>
                        {% endfor %}
                    </select>
                </div>
            {% endfor %}
        </div>
    {% endfor %}

{% endblock %}
